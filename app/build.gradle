plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.dexp.lite'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.dexp.lite'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
